<svg xmlns="http://www.w3.org/2000/svg" width="894" height="196" viewBox="0 0 894 196" role="img" aria-label="The annotation flywheel">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb6c3"/></marker></defs>
<rect x=".5" y=".5" width="893" height="195" rx="14" fill="#0b1f33" stroke="#1b6f6b" stroke-opacity=".6"/>
<text x="20" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6f2f1">The annotation flywheel</text>
<rect x="20" y="64" width="150" height="86" rx="10" fill="#f2a93b" fill-opacity=".12" stroke="#f2a93b" stroke-opacity=".7"/><text x="32" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f2a93b">01</text><text x="32" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Human labels</text><text x="32" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">scar box, type,</text><text x="32" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">zone, side</text><path d="M174,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="196" y="64" width="150" height="86" rx="10" fill="#f2a93b" fill-opacity=".12" stroke="#f2a93b" stroke-opacity=".7"/><text x="208" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f2a93b">02</text><text x="208" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Track</text><text x="208" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">follow the scar</text><text x="208" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">across frames</text><path d="M350,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="372" y="64" width="150" height="86" rx="10" fill="#f2a93b" fill-opacity=".12" stroke="#f2a93b" stroke-opacity=".7"/><text x="384" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f2a93b">03</text><text x="384" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Consensus</text><text x="384" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">3+ raters, absence</text><text x="384" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">counts as a vote</text><path d="M526,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="548" y="64" width="150" height="86" rx="10" fill="#f2a93b" fill-opacity=".12" stroke="#f2a93b" stroke-opacity=".7"/><text x="560" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f2a93b">04</text><text x="560" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Retrain</text><text x="560" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">detector proposes</text><text x="560" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">the next scar</text><path d="M702,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="724" y="64" width="150" height="86" rx="10" fill="#f2a93b" fill-opacity=".12" stroke="#f2a93b" stroke-opacity=".7"/><text x="736" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f2a93b">05</text><text x="736" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Verify</text><text x="736" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">judge, don't draw</text><text x="736" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">faster and steadier</text>
<text x="20" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">Built and wired end to end; the first verification round is what turns the loop.</text>
</svg>